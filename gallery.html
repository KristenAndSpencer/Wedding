    .gallery-card { overflow: hidden; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; height: 220px; background-color: #eee; }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
    .gallery-card img:hover { transform: scale(1.05); }
    .lightbox { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); }
    .lightbox-img { display: block; margin: 4% auto; max-width: 90%; max-height: 85vh; object-fit: contain; border-radius: 4px; }
    .close-lightbox { position: absolute; top: 20px; right: 35px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }

  function loadGallery() {
    const grid = document.getElementById("galleryGrid");
    grid.innerHTML = "";

    imageFiles.forEach(filename => {
      const card = document.createElement("div");
      card.className = "gallery-card";

      const img = document.createElement("img");
      img.alt = "Wedding photo";
      img.loading = "lazy";

      // Strip baseline extension to try multiple formats
      const baseName = filename.replace(/\.(jpg|JPG|jpeg|JPEG)$/i, "");
      
      // Try lowercase first, then uppercase, then JPEG
      const attempts = [
        encodeURI(`${baseName}.jpg`),
        encodeURI(`${baseName}.JPG`),
        encodeURI(`${baseName}.jpeg`),
        encodeURI(`${baseName}.JPEG`)
      ];

      let attemptIndex = 0;
      img.src = attempts[attemptIndex];

      // On 404 error, try the next extension format
      img.onerror = function() {
        attemptIndex++;
        if (attemptIndex < attempts.length) {
          this.src = attempts[attemptIndex];
        } else {
          // If all options fail, hide the broken card
          card.style.display = "none";
        }
      };

      card.onclick = () => openLightbox(img.src);
      card.appendChild(img);
      grid.appendChild(card);
    });
  }

  function openLightbox(src) {
    document.getElementById("lightboxImg").src = src;
    document.getElementById("lightbox").style.display = "block";
  }

  function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
  }

  document.addEventListener("DOMContentLoaded", loadGallery);
